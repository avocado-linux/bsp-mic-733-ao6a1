default_target: jetson-agx-orin
supported_targets:
  - jetson-agx-orin          # 2026 feed
  - jetson-agx-orin-devkit  # 2024 feed

extensions:
  avocado-bsp-mic-733-ao6a1:
    version: 0.2.0
    release: r0
    summary: Board support for the Advantech MIC-733-AO6A1 (carrier extension on jetson-agx-orin)
    description: |
      Layered carrier support for the Advantech MIC-733-AO6A1 industrial
      gateway — the 64GB SOM variant (P3701-0005, board_sku 0005) of the
      same MIC-733-AO carrier the AO5A1 ships on (Jetson AGX Orin SOM,
      Advantech carrier with 4× MGBE / mini-PCIe / M.2 / discrete DI/DO
      / RS-232/422/485). Carrier hardware is identical to the AO5A1;
      only the AGX Orin module capacity differs (32GB / sku 0000 on
      AO5A1, 64GB / sku 0005 on AO6A1), which the
      jetson-agx-orin-devkit.conf flash flow selects from the SOM's
      EEPROM. CARRIER_FV_CHECK_BOARDID/CHECK_BOARDSKU in carrier.env
      pin this extension to sku 0005, so a 32GB module misloaded with
      the AO6A1 BSP fails fast at tegraflash boardid check.

      Files ship with an `-adv` suffix to make their carrier origin
      explicit vs. the stock NVIDIA filenames the MACHINE bakes. The
      sku-driven files use the 0005 variants the conf selects for 64GB:
        * Kernel DTB: the stock r39 tegra234-p3737-0000+p3701-0005-nv.dtb
          plus tegra234-mic-733-carrier.dtbo (CARRIER_FV_OVERLAY_DTB_FILE),
          which enables PCIe C7 (pcie@141a0000, x8) and C8 (pcie@141e0000).
          Advantech's full vendor DTB predates r39 and makes the r39 UEFI
          assert in PcieControllerDxe, so the carrier delta lives in the
          overlay. C7 carries an Intel X550 dual-port 10GbE (8086:1563,
          ixgbe). C8's NIC varies by unit: a second X550 (ports 3 and 4) on
          some, an Intel I350 quad 1GbE (8086:1521, igb) on the bench unit;
          both drivers ship. (The on-SoC MGBE/EQOS are unused.) C8's PHYs are
          GBE-UPHY lanes, so it only comes up when MB1 routes the GBE UPHY to
          PCIe via the factory ODMDATA (gbe-uphy-config-0 /
          hsio-uphy-config-16, CARRIER_ENV_ODMDATA in carrier.env). Without
          it the GBE UPHY is left unpowered (`W> Skipping GBE UPHY config`)
          and probing C8 trips a fatal RAS UE at p2u_gbe_4 (0x3f600c0).
      The BPMP DTB is the unmodified upstream
      tegra234-bpmp-3701-0005-3737-0000.dtb (selected by p3701.conf.common
      for board_sku 0005); no carrier override.
      The carrier-side files (pinmux / GPIO / pad-voltage / MB2 BCT)
      are SOM-SKU independent — p3701.conf.common defaults all SKUs to
      the -p3701-0000(-a04) family — so they match AO5A1 byte-for-byte:
        * tegra234-mb1-bct-pinmux-p3701-0000-a04-adv.dtsi — DP_AUX_CH1→eth3
        * tegra234-mb1-bct-gpio-p3701-0000-a04-adv.dtsi — boot GPIO defaults
          (#included by the pinmux dtsi)
        * tegra234-mb1-bct-padvoltage-p3701-0000-a04-adv.dtsi — for parity
        * tegra234-mb2-bct-misc-p3701-0000-adv.dts — disables the CVB
          (carrier) EEPROM read at I2C0/0xac. The MIC-733-AO carrier
          has no EEPROM at that address, so the stock MB2 BCT busy-
          spins in "Prepare eeprom data". Mirrors the same patch
          Advantech ships in their vendor BSP common.dtsi.
      CARRIER_FV_/CARRIER_ENV_ overrides in carrier.env redirect the
      flash flow at the renamed files; everything else (BPMP firmware,
      PMIC config, partition layout) inherits unchanged from the
      jetson-agx-orin-devkit flash profile.
    license: Apache-2.0
    url: https://github.com/avocadolinux/avocado-os
    vendor: Avocado Linux <info@avocadolinux.org>

    types:
      - sysext
      - confext

    package_files:
      - overlay
      - stone
      - avocado.yaml

    # Carrier overlay files for the MIC-733-AO6A1 live under stone/.
    # avocado-cli composes the path below into the runtime's effective
    # AVOCADO_STONE_INCLUDE_PATHS, scoped to this extension's location
    # (so for consumers that fetch this BSP as a remote extension, stone
    # finds the carrier files at $AVOCADO_PREFIX/includes/avocado-bsp-mic-733-ao6a1/stone/).
    stone_include_paths:
      - stone

    # Confext overlay — ships /etc/hostname so the device identifies as
    # `mic-733-ao6a1` instead of inheriting the SOM's MACHINE-derived
    # `avocado-jetson-agx-orin` default.
    overlay: overlay

    # i2c-dev never autoloads (the Tegra I2C controllers load from the device
    # tree); without it there is no /dev/i2c-*. Built in on 6.18, a module on 6.8.
    modprobe:
      - i2c-dev
      # nvidia-drm-loadconf's /etc/modules-load.d entry arrives with the
      # confext merge, after systemd-modules-load has run, so it never loads
      # the module at boot. Load it here; the modeset/fbdev options in its
      # /etc/modprobe.d file apply.
      - nvidia-drm

    on_merge:
      - udevadm control --reload
      - udevadm trigger --type=subsystems --action=add --settle
      - udevadm trigger --type=devices --action=add --settle
      - nvbootctrl verify

    # Modeled on bsp/jetson-agx-orin-devkit/avocado.yaml's package list,
    # which is the canonical AGX Orin SOM module set. Carrier-specific
    # adjustments below: drop DevKit's onboard Realtek 1GbE bits
    # (RTL8211F PHY / r8169 MAC / linux-firmware-rtl8168) and add
    # kernel-module-ixgbe for the riser X550 dual-port 10GbE.
    packages:
      kernel-module-at24: '*'
      kernel-module-cec: '*'
      kernel-module-fusb301: '*'
      kernel-module-governor-pod-scaling: '*'
      kernel-module-governor-userspace: '*'
      nv-kernel-module-host1x: '*'
      kernel-module-host1x-fence: '*'
      kernel-module-host1x-nvhost: '*'
      kernel-module-ina3221: '*'
      kernel-module-mc-hwpm: '*'
      kernel-module-mc-utils: '*'
      # Ethernet
      # - ixgbe: in-tree Intel driver for the carrier's two X550 dual-port
      #   10GbE NICs (8086:1563) on PCIe C7 (141a0000) and C8 (141e0000) —
      #   all four front 10GbE ports. C8 requires the GBE-UPHY ODMDATA
      #   override (CARRIER_ENV_ODMDATA in carrier.env); see the DTB note in
      #   the description above. (CONFIG_IXGBE=m in avocado-extra.cfg.)
      # - nvethernet/stmmac: on-SoC MGBE/EQOS drivers. The carrier does NOT
      #   wire out the on-SoC MACs (factory leaves them disabled), so these
      #   never bind; kept only for parity with the SOM module set.
      # Carrier Ethernet: Intel NICs on PCIe. ixgbe drives the X550 10GbE on
      # C7; igb drives the I350 quad 1GbE seen on C8 on the bench unit (C8 needs
      # the GBE UPHY routed to PCIe via CARRIER_ENV_ODMDATA). Both are modules
      # on every kernel the feeds serve (linux-yocto 6.18 needs meta-avocado's
      # CONFIG_IXGBE/CONFIG_IGB).
      kernel-module-ixgbe: '*'
      kernel-module-igb: '*'
      kernel-module-nvethernet: '*'
      kernel-module-stmmac: '*'
      kernel-module-nvgpu: '*'
      kernel-module-nvhwpm: '*'
      kernel-module-nvidia: '*'
      kernel-module-nvidia-drm: '*'
      # modeset=1 fbdev=1 and autoload for nvidia-drm: without it the module is
      # installed but never loaded, so there is no KMS device or fbcon.
      nvidia-drm-loadconf: '*'
      kernel-module-nvidia-modeset: '*'
      kernel-module-nvidia-vrs-pseq: '*'
      kernel-module-nvmap: '*'
      kernel-module-nvme: '*'
      kernel-module-nvme-core: '*'
      kernel-module-nvpmodel-clk-cap: '*'
      kernel-module-nvsciipc: '*'
      kernel-module-nvvrs-pseq-rtc: '*'
      kernel-module-pcie-tegra194: '*'
      kernel-module-phy-tegra194-p2u: '*'
      kernel-module-pwm-fan: '*'
      kernel-module-pwm-tegra: '*'
      kernel-module-pwm-tegra-tachometer: '*'
      kernel-module-snd-hda-codec: '*'
      kernel-module-snd-hda-codec-hdmi: '*'
      kernel-module-snd-hda-core: '*'
      kernel-module-snd-hda-tegra: '*'
      kernel-module-snd-soc-audio-graph-card: '*'
      kernel-module-snd-soc-simple-card-utils: '*'
      kernel-module-snd-soc-tegra-audio-graph-card: '*'
      kernel-module-snd-soc-tegra-pcm: '*'
      kernel-module-snd-soc-tegra-utils: '*'
      kernel-module-snd-soc-tegra186-arad: '*'
      kernel-module-snd-soc-tegra186-asrc: '*'
      kernel-module-snd-soc-tegra186-dspk: '*'
      kernel-module-snd-soc-tegra210-admaif: '*'
      kernel-module-snd-soc-tegra210-adx: '*'
      kernel-module-snd-soc-tegra210-ahub: '*'
      kernel-module-snd-soc-tegra210-amx: '*'
      kernel-module-snd-soc-tegra210-dmic: '*'
      kernel-module-snd-soc-tegra210-i2s: '*'
      kernel-module-snd-soc-tegra210-mixer: '*'
      kernel-module-snd-soc-tegra210-mvc: '*'
      kernel-module-snd-soc-tegra210-ope: '*'
      kernel-module-snd-soc-tegra210-sfc: '*'
      kernel-module-spi-tegra114: '*'
      # CAN: the two Tegra234 MTTCAN controllers (c310000/c320000) use
      # NVIDIA's out-of-tree mttcan driver on both kernels, over the in-tree
      # CAN core (can-dev) and raw sockets (can-raw).
      nv-kernel-module-mttcan: '*'
      kernel-module-can-dev: '*'
      kernel-module-can-raw: '*'
      kernel-module-spidev: '*'
      kernel-module-tegra-aconnect: '*'
      kernel-module-tegra-bpmp-thermal: '*'
      kernel-module-tegra-cactmon-mc-all: '*'
      kernel-module-tegra-dce: '*'
      nv-kernel-module-tegra-drm: '*'
      kernel-module-tegra-wmark: '*'
      kernel-module-tegra-xudc: '*'
      kernel-module-tegra210-adma: '*'
      kernel-module-tegra234-aon: '*'
      kernel-module-tegra234-oc-event: '*'
      kernel-module-thermal-trip-event: '*'
      kernel-module-tsecriscv: '*'
      swupdate: '*'
      tegra-redundant-boot-base: '*'

      # L4T GPU userspace + boot-time daemons. tegra-firmware-tegra234 (the
      # ga10b kernel firmware blobs) is delivered via
      # packagegroup-avocado-tegra-rootfs in the rootfs erofs base, *not*
      # here, because the kernel firmware loader returns -40 (ELOOP) when
      # reading firmware files through the sysext /usr overlay.
      cuda-cudart: '*'
      tegra-configs-udev: '*'
      tegra-libraries-cuda: '*'
      tegra-nvpower: '*'
      tegra-nvsciipc: '*'

    # 5.15 (linux-jammy-nvidia-tegra) uses NVIDIA's downstream Realtek shim
    # for any M.2 wifi card; mainline rtw88 isn't built for this kernel.
    # Mirrors bsp/jetson-agx-orin-devkit/avocado.yaml.
    # --- 2024 feed (scarthgap) kernels -------------------------------------
    # tegra-nvphs, tegra-nvstartup and crct10dif-ce exist only in the 2024
    # feed. They are scoped per kernel rather than common.
    kernel-5.15.*:
      packages:
        kernel-module-crct10dif-ce: '*'
        tegra-nvphs: '*'
        tegra-nvstartup: '*'
        nv-kernel-module-rtl8822ce: '*'
        tegra-firmware-rtl8822: '*'

    # 6.6 (linux-yocto, the default kernel) ships drm-display-helper
    # as a separate module; on 5.15 those helpers are statically linked
    # into drm.ko. Use the upstream rtw88 family for any 8822CE M.2 wifi.
    kernel-6.6.*:
      packages:
        kernel-module-crct10dif-ce: '*'
        tegra-nvphs: '*'
        tegra-nvstartup: '*'
        kernel-module-drm-display-helper: '*'
        kernel-module-rtw88-8822c: '*'
        kernel-module-rtw88-8822ce: '*'
        kernel-module-rtw88-core: '*'
        kernel-module-rtw88-pci: '*'
        linux-firmware-rtl8822: '*'

    # --- 2026 feed (wrynose) kernels ---------------------------------------

    # 6.8 (linux-noble-nvidia-tegra, L4T r39.2). crct10dif-ce is a module only
    # on this kernel.
    kernel-6.8.*:
      packages:
        kernel-module-crct10dif-ce: '*'
        # I2C is modular on the L4T kernel (built in on linux-yocto 6.18):
        # without these there are no I2C buses at all.
        kernel-module-i2c-tegra: '*'
        kernel-module-i2c-tegra-bpmp: '*'
        kernel-module-i2c-dev: '*'

    # 6.18 (linux-yocto, the 2026 default). drm-display-helper is a separate
    # module here (the L4T kernel links it into drm.ko).
    kernel-6.18.*:
      packages:
        kernel-module-drm-display-helper: '*'

sdk:
  image: docker.io/avocadolinux/sdk:{{ env.AVOCADO_DISTRO_RELEASE }}
